# Aether OS Default Theme Configuration

[Theme]
Name=Aether Default
Author=Aether OS Project
Version=1.0
Description=Default system theme

[Colors]
Primary=#2196F3
PrimaryDark=#1976D2
PrimaryLight=#BBDEFB
Accent=#FF5722
AccentLight=#FF8A65

# UI Colors
Background=#FFFFFF
BackgroundDark=#121212
Surface=#FFFFFF
SurfaceDark=#1E1E1E

# Text Colors
TextPrimary=#212121
TextSecondary=#757575
TextHint=#9E9E9E
TextPrimaryDark=#FFFFFF
TextSecondaryDark=#B0B0B0

# Status Colors
Success=#4CAF50
Warning=#FFC107
Error=#F44336
Info=#2196F3

# System Colors
StatusBar=#1976D2
NavigationBar=#FFFFFF
Divider=#E0E0E0

[Typography]
FontFamily=Roboto
FontSizeSmall=12
FontSizeMedium=14
FontSizeLarge=16
FontSizeTitle=20
FontSizeHeading=24

[Spacing]
SpaceSmall=8
SpaceMedium=16
SpaceLarge=24
SpaceXLarge=32

[BorderRadius]
Small=4
Medium=8
Large=16
Circle=999

[Shadows]
Elevation1=0 1px 2px rgba(0,0,0,0.12)
Elevation2=0 2px 4px rgba(0,0,0,0.16)
Elevation3=0 4px 8px rgba(0,0,0,0.20)
Elevation4=0 8px 16px rgba(0,0,0,0.24)

[Animations]
DurationFast=150
DurationMedium=300
DurationSlow=500
EasingStandard=cubic-bezier(0.4, 0.0, 0.2, 1)
EasingDecelerate=cubic-bezier(0.0, 0.0, 0.2, 1)
EasingAccelerate=cubic-bezier(0.4, 0.0, 1, 1)
