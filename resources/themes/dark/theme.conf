# Aether OS Dark Theme Configuration

[Theme]
Name=Aether Dark
Author=Aether OS Project
Version=1.0
Description=Dark system theme

[Colors]
Primary=#90CAF9
PrimaryDark=#42A5F5
PrimaryLight=#E3F2FD
Accent=#FF6E40
AccentLight=#FF9E80

# UI Colors
Background=#121212
BackgroundDark=#000000
Surface=#1E1E1E
SurfaceDark=#121212

# Text Colors
TextPrimary=#FFFFFF
TextSecondary=#B0B0B0
TextHint=#757575
TextPrimaryDark=#FFFFFF
TextSecondaryDark=#B0B0B0

# Status Colors
Success=#66BB6A
Warning=#FFA726
Error=#EF5350
Info=#42A5F5

# System Colors
StatusBar=#000000
NavigationBar=#1E1E1E
Divider=#2C2C2C

[Typography]
FontFamily=Roboto
FontSizeSmall=12
FontSizeMedium=14
FontSizeLarge=16
FontSizeTitle=20
FontSizeHeading=24

[Spacing]
SpaceSmall=8
SpaceMedium=16
SpaceLarge=24
SpaceXLarge=32

[BorderRadius]
Small=4
Medium=8
Large=16
Circle=999

[Shadows]
Elevation1=0 1px 2px rgba(0,0,0,0.4)
Elevation2=0 2px 4px rgba(0,0,0,0.5)
Elevation3=0 4px 8px rgba(0,0,0,0.6)
Elevation4=0 8px 16px rgba(0,0,0,0.7)

[Animations]
DurationFast=150
DurationMedium=300
DurationSlow=500
EasingStandard=cubic-bezier(0.4, 0.0, 0.2, 1)
EasingDecelerate=cubic-bezier(0.0, 0.0, 0.2, 1)
EasingAccelerate=cubic-bezier(0.4, 0.0, 1, 1)
