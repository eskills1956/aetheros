# Aether OS Services Configuration
# Defines system services and their startup order

[Services]
# Core system services
CoreServices=display,audio,power,network

# Service startup order
StartupOrder=power,network,audio,display

[Display]
Enabled=true
Binary=/usr/bin/aether-display-service
AutoStart=true
RestartOnFailure=true

[Audio]
Enabled=true
Binary=/usr/bin/aether-audio-service
AutoStart=true
RestartOnFailure=true

[Power]
Enabled=true
Binary=/usr/bin/aether-power-service
AutoStart=true
RestartOnFailure=true

[Network]
Enabled=true
Binary=/usr/bin/aether-network-service
AutoStart=true
RestartOnFailure=true
