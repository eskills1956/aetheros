# Aether OS System Configuration
# Default system-wide settings

[System]
# System name and version
Name=AetherOS
Version=1.0.0
Codename=Aurora

[Display]
# Default display settings
DefaultBrightness=75
AutoBrightness=true
ScreenTimeout=30

[Audio]
# Default audio settings
DefaultVolume=50
MaxVolume=100
SoundEffectsEnabled=true

[Power]
# Power management settings
LowBatteryThreshold=15
CriticalBatteryThreshold=5
SuspendOnCritical=true
CPUGovernor=performance

[Network]
# Network settings
WiFiEnabled=true
BluetoothEnabled=false
MobileDataEnabled=false
AirplaneMode=false

[Security]
# Security settings
SELinuxMode=enforcing
VerifiedBoot=true
AppSandboxing=true
