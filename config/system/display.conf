# Display and Compositor Configuration

[Compositor]
# Wayland compositor settings
Backend=drm
Renderer=gles2
EnableVsync=true

[Screen]
# Screen settings
DefaultResolution=1080x2340
DefaultDPI=420
DefaultOrientation=portrait
RotationSupport=true

[Graphics]
# Graphics acceleration
HardwareAcceleration=true
GPUVendor=auto
EnableTouchscreen=true
MultiTouchSupport=true

[Rendering]
# Rendering settings
FPS=60
EnableVirtualKeyboard=true
EnableGestures=true
