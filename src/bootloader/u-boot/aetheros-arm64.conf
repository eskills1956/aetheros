# U-Boot configuration for Aether OS (ARM64)
# This file contains U-Boot environment variables and boot commands

# Board configuration
CONFIG_ARM64=y
CONFIG_ARCH_SUNXI=y
CONFIG_DEFAULT_DEVICE_TREE="sun50i-a64-aetheros"

# Memory configuration
CONFIG_SYS_TEXT_BASE=0x4a000000
CONFIG_SYS_LOAD_ADDR=0x42000000

# Boot configuration
CONFIG_BOOTDELAY=3
CONFIG_BOOTCOMMAND="run aetheros_boot"

# Environment variables
bootargs=console=ttyS0,115200 earlyprintk root=/dev/mmcblk0p2 rootwait ro
bootcmd=run aetheros_boot
bootfile=Image

# Aether OS specific boot commands
aetheros_boot=echo Booting Aether OS...; \
    load mmc 0:1 ${kernel_addr_r} /boot/Image; \
    load mmc 0:1 ${ramdisk_addr_r} /boot/initramfs.img; \
    booti ${kernel_addr_r} ${ramdisk_addr_r} ${fdt_addr_r}

aetheros_recovery=echo Booting Aether OS (Recovery)...; \
    setenv bootargs ${bootargs} single; \
    run aetheros_boot

# Fastboot support
CONFIG_FASTBOOT=y
CONFIG_FASTBOOT_FLASH=y
CONFIG_FASTBOOT_FLASH_MMC_DEV=0

# USB support
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_DOWNLOAD=y
CONFIG_USB_FUNCTION_FASTBOOT=y

# Display support
CONFIG_VIDEO=y
CONFIG_DM_VIDEO=y
CONFIG_DISPLAY=y

# Network support (optional)
CONFIG_NET=y
CONFIG_CMD_NET=y
CONFIG_CMD_DHCP=y
